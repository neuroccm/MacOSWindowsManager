name: MacOSWindowsManager
options:
  bundleIdPrefix: com.houman
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  MacOSWindowsManager:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacOSWindowsManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houman.MacOSWindowsManager
        PRODUCT_NAME: MacOSWindowsManager
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacOSWindowsManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MacOSWindowsManagerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacOSWindowsManagerTests
    dependencies:
      - target: MacOSWindowsManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houman.MacOSWindowsManagerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MacOSWindowsManager:
    build:
      targets:
        MacOSWindowsManager: all
        MacOSWindowsManagerTests: [test]
    test:
      targets:
        - MacOSWindowsManagerTests
